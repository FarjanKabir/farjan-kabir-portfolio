<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Professional CV of Farjan Kabir — WordPress Developer, SEO Specialist, and Founder of Farjan Paradox.">
  <link rel="icon" type="image/png" href="./assets/Image6.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="cv.css"> <!-- নতুন CV স্টাইল -->
</head>
<body class="inner-page cv-page">
  
  <!-- Header -->
  <header class="site-header is-scrolled">
    <div class="nav-container">
      <a href="./index.html" class="nav-brand nav-brand-with-logo">
        <img src="./assets/Image6.png" alt="Farjan Paradox logo">
        <span>Farjan<span class="nav-brand-accent">Paradox</span></span>
      </a>
      <nav class="nav-menu" id="navMenu">
        <ul class="nav-list">
          <li><a href="./index.html" class="nav-link">Home</a></li>
          <li><a href="./index.html#portfolio" class="nav-link">Work</a></li>
          <li><a href="./cv.html" class="nav-link is-active">CV</a></li>
          <li><a href="./blog.html" class="nav-link">Blog</a></li>
          <li><a href="./index.html#contact" class="nav-link">Contact</a></li>
        </ul>
      </nav>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation menu"><span></span><span></span><span></span></button>
    </div>
  </header>

  <!-- CV Wrapper -->
  <main class="cv-wrapper">
    <div class="container">
      
      <!-- Action Bar (Toggle, Print, Share) -->
      <div class="cv-action-bar">
        <div class="case-lang-switch" style="position:static; margin:0; float:none;">
          <button class="lang-btn" data-lang="en"><i class="fa-solid fa-globe"></i> English</button>
          <button class="lang-btn" data-lang="bn"><i class="fa-solid fa-globe"></i> বাংলা</button>
        </div>
        <div class="cv-action-btns">
          <button onclick="window.print()" class="cv-action-btn"><i class="fa-solid fa-print"></i> Print / Save PDF</button>
          <button id="cvShareBtn" class="cv-action-btn"><i class="fa-solid fa-share-nodes"></i> Share CV</button>
        </div>
      </div>

      <!-- CV Content Target -->
      <div id="cvContent" class="cv-content"></div>
      
    </div>
  </main>

  <script src="cv.js"></script>
</body>
</html>
